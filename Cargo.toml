[package]
edition = "2024"
name = "peek"
version = "0.1.0"

[dependencies]
anstream = "1.0.0"
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
flate2 = "1.1.10"
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
rayon = "1.12.0"
regex = "1.13.1"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
sha2 = "0.11.0"
tar = "0.4.46"
unicode-width = "0.2.2"
zstd = "0.14"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
panic = "abort"
